services:
  selfnotes:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SYSTEM_ENCRYPTION_KEY: ${SYSTEM_ENCRYPTION_KEY:?set a 64-char hex key}
      SESSION_SECRET: ${SESSION_SECRET:?set a session secret}
      WEBAUTHN_ID: ${WEBAUTHN_ID:?e.g. notes.example.com}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?e.g. https://notes.example.com}
      WEBAUTHN_NAME: ${WEBAUTHN_NAME:-Sec SelfNotes}
      PORT: ${PORT:-4000}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${PORT:-4000}:${PORT:-4000}"

  # Optional sync service (OneNote / folder import, export). Separate image; serve at <host>/sync via Caddy.
  sync:
    build: ./sync
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${SYNC_PORT:-4100}
      BASE_PATH: /sync
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_TENANT: ${MS_TENANT:-common}
    ports:
      - "${SYNC_PORT:-4100}:${SYNC_PORT:-4100}"
